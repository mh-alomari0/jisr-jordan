<!-- public/app-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Teal) -->
    <linearGradient id="bgTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06484b"/>
      <stop offset="50%" stop-color="#087f79"/>
      <stop offset="100%" stop-color="#0ca39b"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe3a8"/>
      <stop offset="100%" stop-color="#f7b733"/>
    </linearGradient>

    <!-- Inner Glow Shadow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022a2c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Container (Apple & Android Adaptive Base) -->
  <rect width="512" height="512" rx="128" fill="url(#bgTeal)"/>

  <!-- Subtle Horizon Glow Arc (Bridge Concept) -->
  <circle cx="256" cy="480" r="280" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="40"/>
  <circle cx="420" cy="90" r="100" fill="url(#accentGold)" opacity="0.15" filter="blur(30px)"/>

  <!-- Central Emblem: Stylized Bridge Arch & "ج" Glyph -->
  <g filter="url(#subtleGlow)" transform="translate(10, -5)">
    <!-- Main Arch of Letter Jim (The Bridge) -->
    <path
      d="M 170 180 
         C 210 180, 310 180, 340 180
         C 355 180, 365 192, 360 205
         C 345 250, 310 320, 230 350
         C 160 376, 120 330, 140 280
         C 150 255, 175 250, 195 265
         C 210 276, 215 295, 200 310
         C 190 320, 180 315, 175 305"
      fill="none"
      stroke="#ffffff"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- The Diacritic Dot of Jim (The Rising Golden Spark) -->
    <circle cx="256" cy="275" r="22" fill="url(#accentGold)"/>
  </g>
</svg>